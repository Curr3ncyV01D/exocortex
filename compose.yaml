services:
  backend:
    build:
      context: .
    user: "${EXOCORTEX_UID:-1000}:${EXOCORTEX_GID:-1000}"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/exocortex.db
      - GEMINI_API_KEY
      - GEMINI_MODEL
      - MAX_CONTEXT_BYTES
      - GEMINI_REQUEST_TIMEOUT_SECONDS
      - AGENT_OPERATION_TIMEOUT_SECONDS
    volumes:
      - type: bind
        source: "${EXOCORTEX_DATA_DIR:-./data}"
        target: /app/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    environment:
      PROXY_READ_TIMEOUT_SECONDS: "${PROXY_READ_TIMEOUT_SECONDS:-1860}"
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:${EXOCORTEX_PORT:-8080}:80"
